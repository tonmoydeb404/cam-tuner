name: Release Extension + Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck --filter=@cam-tuner/extension...

      - name: Lint
        run: pnpm turbo lint --filter=@cam-tuner/extension...

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Test
        run: pnpm turbo test --filter=@cam-tuner/extension...

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependency packages
        run: pnpm turbo build --filter=@cam-tuner/extension^...

      - name: Zip Chrome extension
        run: pnpm --filter @cam-tuner/extension zip

      - name: Zip Firefox extension
        run: pnpm --filter @cam-tuner/extension zip:firefox

      - name: Upload ZIPs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            apps/extension/.output/cam-tuner-*-chrome.zip
            apps/extension/.output/cam-tuner-*-firefox.zip
            apps/extension/.output/cam-tuner-*-sources.zip

  # Desktop builds run after the extension release so the GitHub release
  # already exists and tauri-action just appends assets to it. Skipped on
  # workflow_dispatch (manual re-zips only touch extension artifacts).
  release-desktop-macos:
    name: Desktop macOS
    needs: release
    if: github.event_name == 'push'
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "CamTuner ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

  release-desktop-linux:
    name: Desktop Linux
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "CamTuner ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --bundles deb

  release-desktop-windows:
    name: Desktop Windows
    needs: release
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "CamTuner ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false

  update-homebrew-cask:
    name: Update Homebrew cask
    needs: release-desktop-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version and slug
        id: brand
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "slug=$(node -p "require('./brand.json').slug")" >> "$GITHUB_OUTPUT"
          echo "app_name=$(node -p "require('./brand.json').appName")" >> "$GITHUB_OUTPUT"

      - name: Compute DMG sha256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ steps.brand.outputs.app_name }}_${{ steps.brand.outputs.version }}_aarch64.dmg" \
            --output dmg
          sha256=$(shasum -a 256 dmg | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Update cask
        run: |
          version="${{ steps.brand.outputs.version }}"
          sha256="${{ steps.sha.outputs.sha256 }}"
          cask="Casks/${{ steps.brand.outputs.slug }}.rb"
          sed -i "s/version \".*\"/version \"$version\"/" "$cask"
          sed -i "s/sha256 .*/sha256 \"$sha256\"/" "$cask"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- "Casks/${{ steps.brand.outputs.slug }}.rb" && exit 0
          git add "Casks/${{ steps.brand.outputs.slug }}.rb"
          git commit -m "chore: update homebrew cask to v${{ steps.brand.outputs.version }}"
          git push origin HEAD:main
