[package]
name = "cam-tuner"
version = "3.1.2"
description = "Fine-tune your webcam — crop, zoom, align, and blur, as a cross-platform desktop app."
authors = ["Tonmoy Deb"]
homepage = "https://tonmoydeb.com"
repository = "https://github.com/tonmoydeb404/cam-tuner"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cam_tuner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1"
camtuner-core = { path = "../../../crates/camtuner-core" }
camtuner-capture = { path = "../../../crates/camtuner-capture" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
jpeg-encoder = "0.6"
rand = "0.9"

# `tauri dev` builds in debug, which makes unoptimized scalar video loops
# ~20x slower (1080p preview measured at 6 fps debug vs 118 fps release).
# Keep the app crate fast to compile, but always optimize the media crates.
[profile.dev.package.camtuner-core]
opt-level = 3

[profile.dev.package.camtuner-capture]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3
