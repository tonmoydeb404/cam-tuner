[package]
name = "camtuner-capture"
version = "0.1.0"
edition = "2021"
description = "Camera capture backends for CamTuner Desktop: CaptureBackend trait, synthetic test source, platform backends."

[dependencies]
camtuner-core = { path = "../camtuner-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSArray"] }
objc2-core-foundation = "0.3"
objc2-core-media = { version = "0.3", features = ["objc2-core-video"] }
objc2-core-video = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
dispatch2 = "0.3"
block2 = "0.6"
