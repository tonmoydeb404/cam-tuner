[package]
name = "camtuner-core"
version = "0.1.0"
edition = "2021"
description = "Pure video-processing primitives for CamTuner Desktop: crop/zoom/align geometry, config model, NV12/BGRA frame ops."

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
