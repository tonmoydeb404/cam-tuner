[package]
name = "camtuner-vcam-dal"
version = "0.1.0"
edition = "2021"
description = "CamTuner virtual camera as a CMIO DAL plugin (macOS): pure-Rust implementation of the CMIOHardwarePlugInInterface."
build = "build.rs"

[lib]
name = "camtuner_vcam_dal"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "assemble-plugin"
path = "src/bin/assemble.rs"

[[bin]]
name = "list-cmio-devices"
path = "src/bin/list-cmio-devices.rs"
required-features = []

[dependencies]
camtuner-vcam = { path = "../camtuner-vcam" }
libc = "0.2"
