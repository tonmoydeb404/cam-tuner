[package]
name = "camtuner-vcam"
version = "0.1.0"
edition = "2021"
description = "Virtual-camera transport for CamTuner: Unix-socket frame protocol shared by the app (server) and native camera plugins (clients)."

[dependencies]
camtuner-core = { path = "../camtuner-core" }
camtuner-capture = { path = "../camtuner-capture" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "vcam-test-server"
path = "src/bin/vcam-test-server.rs"
